services:
  db:
    image: postgres:18.3-alpine
    restart: unless-stopped
    shm_size: 128mb
    environment:
      POSTGRES_USER: leafcode
      POSTGRES_PASSWORD: leafcode
      POSTGRES_DB: leafcode
    ports:
      - 5432:5432
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leafcode -d leafcode"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer
    restart: unless-stopped
    ports:
      - 8080:8080

volumes:
  pg_data:
